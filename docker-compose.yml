# Pinned explicitly so the project name no longer depends on which directory
# `docker compose` is run from. Without this, Compose derives the name from the
# directory basename, which meant the containers/volumes created from a
# worktree called `initial-poc` were invisible (and port-conflicting) from any
# other checkout. The value keeps that historical name so the existing volumes
# — which hold the current dev data — stay attached.
name: initial-poc

services:
  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: flickpick_user
      POSTGRES_USER: flickpick
      POSTGRES_PASSWORD: flickpick
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

  import-db:
    image: postgres:16
    environment:
      POSTGRES_DB: flickpick_import
      POSTGRES_USER: flickpick
      POSTGRES_PASSWORD: flickpick
    ports:
      - "5434:5432"
    volumes:
      - import-db-data:/var/lib/postgresql/data

  ranking-db:
    image: postgres:16
    environment:
      POSTGRES_DB: flickpick_ranking
      POSTGRES_USER: flickpick
      POSTGRES_PASSWORD: flickpick
    ports:
      - "5435:5432"
    volumes:
      - ranking-db-data:/var/lib/postgresql/data

volumes:
  user-db-data:
  import-db-data:
  ranking-db-data:
