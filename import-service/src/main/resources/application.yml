server:
  port: 8082

spring:
  application:
    name: import-service
  datasource:
    url: jdbc:postgresql://localhost:5434/flickpick_import
    username: flickpick
    password: flickpick
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      cors:
        allowed-origins: http://localhost:5173
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS

jwt:
  public-key: classpath:certs/public.pem

letterboxd:
  # Username is appended as <base-url>/<username>/rss/
  base-url: https://letterboxd.com

ranking-service:
  base-url: http://localhost:8083
