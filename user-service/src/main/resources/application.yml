server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5433/flickpick_user
    username: flickpick
    password: flickpick
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      cors:
        allowed-origins: http://localhost:5173
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS
